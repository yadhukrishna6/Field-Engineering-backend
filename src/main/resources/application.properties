# ==============================================================================
# FIELD ENGINEERING QUARKUS REST API BACKEND CONFIGURATION
# ==============================================================================

quarkus.application.name=field-engineering-backend
quarkus.http.port=8081
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with

# PostgreSQL Datasource Configuration (Production)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:field_engineering_db}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# Development Profile (Standalone In-Memory H2)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:field_engineering_dev;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.flyway.migrate-at-start=false

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# SmallRye JWT Authentication
mp.jwt.verify.publickey.location=/META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=https://field-engineering.internal/auth

# AWS S3 / MinIO Object Storage Configuration
aws.s3.bucket.name=${AWS_S3_BUCKET:field-engineering-blueprints}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.endpoint-override=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:minioadmin}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:minioadmin}

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
