services:
  postgres:
    image: postgres:16-alpine
    container_name: field_backend_postgres
    environment:
      POSTGRES_DB: field_engineering_db
      POSTGRES_USER: field_admin
      POSTGRES_PASSWORD: field_secure_password_2026
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U field_admin -d field_engineering_db]
      interval: 5s
      timeout: 5s
      retries: 5

  s3mock:
    image: adobe/s3mock:latest
    container_name: field_backend_s3mock
    environment:
      initialBuckets: field-engineering-blueprints,field-engineering-storage
    ports:
      - 9000:9090
    volumes:
      - s3_data:/root/.s3mock

volumes:
  postgres_data:
  s3_data:
