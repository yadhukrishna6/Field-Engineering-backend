version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: field_backend_postgres
    environment:
      POSTGRES_DB: field_engineering_db
      POSTGRES_USER: field_admin
      POSTGRES_PASSWORD: field_secure_password_2026
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U field_admin -d field_engineering_db]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: field_backend_minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
